<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helpdesk</title>
<meta name="theme-color" content="#2563eb"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<script>const BASE=(location.pathname.match(/^\/helpdesk(?=\/|$)/i)||[''])[0];document.write('<link rel="manifest" href="'+BASE+'/manifest.webmanifest"><link rel="icon" href="'+BASE+'/icon.svg">')</script>
<style>
:root{--bg:#f5f7f9;--panel:#fff;--ink:#12344d;--mut:#6b7c8c;--line:#e4e9ee;--acc:#2c5cc5;--acc2:#234aa0;--sel:#eaf2ff;--rail:#f3f5f7;--red:#d93025;--redbg:#fde8e7;--amb:#c77700;--grn:#16a34a;--note:#fff7e0;--logo:#1fa85a}
@media(prefers-color-scheme:dark){:root{--bg:#0f151c;--panel:#161e27;--ink:#e3eaf1;--mut:#8797a7;--line:#263340;--acc:#5b8def;--acc2:#7fa6f5;--sel:#1c2c47;--rail:#121a22;--redbg:#3a1d1b;--note:#3a3216}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:flex;height:100vh}
#rail{width:56px;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;flex:none}
.logo{width:34px;height:34px;border-radius:50%;background:var(--logo);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:12px}.logo svg{stroke-width:2.2}
#nav{display:flex;flex-direction:column;gap:6px;align-items:center}
#rail button,#rail a{width:38px;height:38px;border-radius:8px;border:0;background:none;color:#3d566b;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
#rail button:hover,#rail a:hover{background:#e3e8ed}
#nav button.on{background:#dfe5ea;color:var(--ink)}
@media(prefers-color-scheme:dark){#rail button,#rail a{color:#9db0c2}#rail button:hover,#rail a:hover{background:#1e2a36}#nav button.on{background:#253343;color:#fff}}
.railbot{margin-top:auto;display:flex;flex-direction:column;gap:6px;align-items:center}
#shell{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:0 16px;height:48px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
#crumb{font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#crumb b{color:var(--acc);font-weight:600}#crumb i{color:var(--mut);font-style:normal;margin:0 6px}#crumb span{font-weight:600}
#meName{color:var(--mut);font-size:13px;white-space:nowrap}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500}.btn:hover{background:var(--acc2)}
.ico{width:16px;height:16px;vertical-align:-3px;margin-right:5px}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid #cfd8e0;font-weight:400}.btn.sec:hover{background:var(--bg)}
input,select,textarea{background:var(--panel);border:1px solid #cfd8e0;border-radius:6px;padding:6px 8px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #2c5cc533;border-color:var(--acc)}
textarea{resize:vertical;min-height:90px}label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
main{flex:1;min-height:0;display:flex}
.view{display:none;flex:1;min-height:0}.view.on{display:flex}
#list{width:340px;flex:none;overflow:auto;border-right:1px solid var(--line);background:var(--panel)}
.lhead{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;position:sticky;top:0;background:var(--panel);z-index:2}
.lhead svg{width:16px;height:16px;color:var(--mut)}
#viewSel{border:0;background:none;font-weight:600;padding:4px 2px;width:auto;max-width:230px;cursor:pointer;color:var(--ink)}
#viewSel:focus{outline:0}.cnt{margin-left:auto;color:var(--mut);font-size:12px}
.search{padding:0 12px 10px;border-bottom:1px solid var(--line);position:sticky;top:42px;background:var(--panel);z-index:2}
.search input{border-radius:18px;padding:7px 12px;background:var(--bg)}
.row{display:flex;gap:10px;padding:12px 12px;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.row:hover{background:var(--bg)}.row.on{background:var(--sel);border-left-color:var(--acc)}
.rb{min-width:0;flex:1}
.r1{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}.who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.r2{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0 3px}
.r3{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);min-width:0}.r3 svg{width:14px;height:14px}
.r3 em{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sla{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--ink);padding:1px 6px;border-radius:10px;white-space:nowrap;flex:none}.sla svg{width:12px;height:12px}
.sla.od{background:var(--redbg);color:var(--red)}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none;font-size:14px}
.av.sm{width:30px;height:30px;font-size:13px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:var(--bg);border:1px solid var(--line)}
.p1{color:var(--mut)}.p2{color:var(--acc)}.p3{color:var(--amb);font-weight:600}.p4{color:var(--red);font-weight:700}
.st2{color:var(--grn)}.st3{color:var(--amb)}.st4,.st5{color:var(--mut)}
.od{color:#fff;background:var(--red);border-color:var(--red)}
#detail{flex:1;overflow:auto;padding:18px 24px;min-width:0}
.empty{color:var(--mut);text-align:center;margin-top:80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.msg{display:flex;gap:10px;margin:14px 0;white-space:pre-wrap;word-wrap:break-word}
.mb{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
.msg.reply .mb{border-left:3px solid var(--acc)}.msg.note .mb{background:var(--note);border-left:3px solid var(--amb)}
.msg .h{font-size:12px;color:var(--mut);margin-bottom:5px;display:flex;justify-content:space-between;gap:8px}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{border:1px solid var(--line);background:var(--panel);padding:4px 12px;border-radius:14px;cursor:pointer}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.page{padding:20px 24px;overflow:auto;flex:1}table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:500;font-size:12px}
.big{font-size:28px;font-weight:700}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi span{color:var(--mut);font-size:12px}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:30}
#modal.on{display:flex}#modal .box{background:var(--panel);border-radius:10px;padding:18px;width:min(520px,94vw);max-height:92vh;overflow:auto}
#toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;display:none;z-index:40}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px}
.flex{display:flex;gap:8px;align-items:center}.sp{flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap}.backBtn{display:none}
@media(max-width:820px){
 #app{display:block;height:100dvh}
 #rail{position:fixed;left:0;right:0;bottom:0;z-index:20;width:100%;height:56px;padding-bottom:env(safe-area-inset-bottom);box-sizing:content-box;flex-direction:row;justify-content:space-around;padding-left:4px;padding-right:4px;border-right:0;border-top:1px solid var(--line);gap:0}
 .logo,#rail .railbot a{display:none}.railbot{margin:0;flex-direction:row}
 #nav{flex-direction:row;gap:0;flex:1;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}#nav button{flex:1 0 44px}
 #rail button,#rail a{width:44px;height:44px}
 #shell{height:100dvh;padding-bottom:calc(56px + env(safe-area-inset-bottom))}
 body:has(#v-tickets.on[data-pane=detail]) #rail{display:none}
 body:has(#v-tickets.on[data-pane=detail]) #shell{padding-bottom:0}
 header{padding:0 12px}#meName{display:none}
 #newBtn{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:8;border-radius:28px;padding:14px 20px;box-shadow:0 4px 14px #0005;font-size:15px}
 main{min-width:0;overflow-x:hidden}.view{min-width:0;width:100%;max-width:100vw}
 #list{width:100%;flex:1;border-right:0;padding-bottom:90px}
 #detail{width:100%;padding:12px 12px 90px;overflow-x:hidden}#detail h2{font-size:18px;min-width:0;word-break:break-word}
 #v-tickets[data-pane=list] #detail{display:none}
 #v-tickets[data-pane=detail] #list{display:none}
 body:has(#v-tickets[data-pane=detail]) #newBtn{display:none}
 .backBtn{display:inline-block}
 input,select,textarea{font-size:16px;min-height:42px}
 .btn,.tabs button{min-height:42px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 input,select,textarea{min-width:0;max-width:100%}
 .flex{flex-wrap:wrap}.flex>*{min-width:0}
 .page{padding:12px 12px 90px}.page table{display:block;overflow-x:auto}
 #modal .box{width:100vw;height:100vh;max-height:100vh;border-radius:0;padding-bottom:40px}#toast{bottom:76px;left:12px;right:12px}
 .row{padding:14px 12px}
 .actions .btn{flex:1 1 45%}
 #toast{left:12px;right:12px;bottom:130px;text-align:center}
}
body[data-view]:not([data-view=tickets]) #newBtn{display:none!important}

.att{display:inline-block;margin:6px 6px 0 0;padding:3px 10px;border:1px solid var(--line);border-radius:14px;font-size:12px;text-decoration:none;color:var(--acc);white-space:normal;background:var(--panel)}
.att i{color:var(--mut);font-style:normal}.att b{cursor:pointer;margin-left:6px;color:var(--mut)}
</style></head><body>
<div id="app">
<aside id="rail">
  <div class="logo" title="Helpdesk"><svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg></div>
  <nav id="nav">
    <button data-v="dash" title="Dashboard" aria-label="Dashboard"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 12l4-4M7 16h.01M12 5v1M5 12h1M19 12h-1"/></svg></button>
    <button data-v="tickets" class="on" title="Tickets" aria-label="Tickets"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M13 6v12" stroke-dasharray="2 2"/></svg></button>
    <button data-v="tasks" title="Tasks" aria-label="Tasks"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg></button>
    <button data-v="threads" title="Team threads" aria-label="Team threads"><svg viewBox="0 0 24 24"><path d="M4 5h12v8H9l-3 3v-3H4z"/><path d="M18 9h2v8h-2v3l-3-3h-5v-2"/></svg></button>
    <button data-v="reports" title="Reports" aria-label="Reports"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
    <button data-v="kb" title="Knowledge base" aria-label="Knowledge base"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/></svg></button>
    <button data-v="auto" title="Automations" aria-label="Automations"><svg viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 8V4M9 13v1M15 13v1M3 13v2M21 13v2"/></svg></button>
    <button data-v="canned" title="Canned replies" aria-label="Canned replies"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg></button>
    <button data-v="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </nav>
  <div class="railbot"><a href="#" id="portalLink" target="_blank" title="Customer portal" aria-label="Customer portal"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></a><button id="logout" title="Sign out" aria-label="Sign out"><svg viewBox="0 0 24 24"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M16 8l4 4-4 4M20 12H9"/></svg></button></div>
</aside>
<div id="shell">
<header>
  <div id="crumb"></div><span class="sp"></span><span id="meName"></span>
  <button class="btn" id="newBtn">+ New ticket</button>
</header>
<main>
  <section class="view on" id="v-tickets" data-pane="list">
    <div id="list"><div class="lhead"><svg viewBox="0 0 24 24"><path d="M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3"/></svg><select id="viewSel" aria-label="Ticket view"></select><span class="cnt" id="cnt"></span></div>
      <div class="search"><input id="q" placeholder="Search subject, #id, requester…"></div><div id="rows"></div></div>
    <div id="detail"><div class="empty">Select a ticket</div></div>
  </section>
  <section class="view" id="v-dash"><div class="page" id="dash"></div></section>
  <section class="view" id="v-tasks"><div class="page" id="tasksp"></div></section>
  <section class="view" id="v-threads"><div class="page" id="threadsp"></div></section>
  <section class="view" id="v-reports"><div class="page" id="reportsp"></div></section>
  <section class="view" id="v-kb"><div class="page" id="kbp"></div></section>
  <section class="view" id="v-auto"><div class="page" id="autop"></div></section>
  <section class="view" id="v-canned"><div class="page" id="cannedp"></div></section>
  <section class="view" id="v-settings"><div class="page" id="setp"></div></section>
</main>
</div></div>
<div id="modal"><div class="box" id="mbox"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
$('#portalLink').href=BASE+'/portal';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){
  const r=await fetch(BASE+'/api'+path,{method,headers:{'Content-Type':'application/json','X-Base-Path':BASE},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){location.reload();throw new Error('login required')}
  if(!r.ok){toast(j.error||('Error '+r.status),true);throw new Error(j.error||r.status)}
  return j;
}
function toast(m,bad){const t=$('#toast');t.textContent=m;t.style.background=bad?'var(--red)':'';t.style.color=bad?'#fff':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}
const S={view:'open',sel:null,agents:[],groups:[],canned:[],me:null,role:'agent',tab:'reply'};
const ST={2:'Open',3:'Pending',4:'Resolved',5:'Closed'},PR={1:'Low',2:'Medium',3:'High',4:'Urgent'};
const ago=iso=>{if(!iso)return'';const m=Math.round((Date.now()-new Date(iso))/6e4);if(m<1)return'now';if(m<60)return m+'m';if(m<1440)return Math.round(m/60)+'h';return Math.round(m/1440)+'d'};
const fsize=n=>n<1024?n+' B':n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1)+' MB';
const attHtml=l=>(l&&l.length)?'<div>'+l.map(a=>`<a class="att" target="_blank" rel="noopener" href="${BASE}/api/attachments/${a.id}">&#128206; ${esc(a.filename)} <i>${fsize(a.size)}</i></a>`).join('')+'</div>':'';
const readFile=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok({name:f.name,type:f.type||'application/octet-stream',size:f.size,data:String(r.result).split(',')[1]||''});r.onerror=()=>no(r.error);r.readAsDataURL(f)});
const fdate=iso=>iso?new Date(iso).toLocaleString():'-';
const opts=(arr,sel,blank)=>(blank!==undefined?`<option value="">${blank}</option>`:'')+arr.map(([v,l])=>`<option value="${v}" ${String(v)===String(sel)?'selected':''}>${esc(l)}</option>`).join('');

async function boot(){
  const me=await api('/me');S.me=me.id;S.role=me.role;S.meName=me.name;S.publicUrl=me.public_url||'';
  if(me.must_change){forcePin(me.name);return}
  [S.agents,S.groups,S.canned]=await Promise.all([api('/agents'),api('/groups'),api('/canned')]);
  $('#meName').textContent=me.name+(me.role==='admin'?' (admin)':'');
  $('#logout').onclick=async()=>{await fetch(BASE+'/api/logout',{method:'POST',headers:{'X-Base-Path':BASE}});location.reload()};
  if(me.role!=='admin'){const n=document.querySelector('#nav button[data-v="auto"]');if(n)n.style.display='none'}
  loadSide();loadList();
  openFromHash();
}
function forcePin(name){
  document.querySelectorAll('#rail,#shell').forEach(e=>e.style.display='none');
  const w=document.createElement('div');w.style.cssText='position:fixed;inset:0;z-index:9999;overflow:auto;background:var(--bg);padding:16px;display:flex;align-items:flex-start;justify-content:center';
  w.innerHTML=`<div style="width:100%;max-width:380px;margin-top:10vh;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px"><h2 style="margin-top:0">Welcome, ${esc(name)}</h2><p style="color:var(--mut)">Choose your own PIN (6-12 digits). You'll use it every time you sign in.</p>
   <label>New PIN</label><input id="np1" type="password" inputmode="numeric" autocomplete="new-password"><label>Repeat new PIN</label><input id="np2" type="password" inputmode="numeric" autocomplete="new-password">
   <div id="npe" style="color:var(--red);min-height:1.4em;margin-top:6px"></div><button class="btn" id="npok" style="width:100%">Save my PIN</button></div>`;
  document.body.appendChild(w);
  $('#npok').onclick=async()=>{const a=$('#np1').value.trim(),b=$('#np2').value.trim();
    if(a!==b){$('#npe').textContent='The two PINs do not match';return}
    const r=await fetch(BASE+'/api/me/pin',{method:'POST',headers:{'Content-Type':'application/json','X-Base-Path':BASE},body:JSON.stringify({pin:a})});
    const j=await r.json().catch(()=>({}));if(r.ok)location.reload();else $('#npe').textContent=j.error||'Could not save'};
}
function openFromHash(){const m=/^#t(\d+)$/.exec(location.hash);if(m){show('tickets');openTicket(+m[1]).catch(()=>{})}}
window.addEventListener('hashchange',()=>{const m=/^#t(\d+)$/.exec(location.hash);if(m&&+m[1]!==S.sel)openFromHash()});
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;show(b.dataset.v)};
const VIEWNAME={tasks:'Tasks',threads:'Team threads',reports:'Reports',dash:'Dashboard',kb:'Knowledge base',auto:'Automations',canned:'Canned replies',settings:'Settings'};
const VIEWLBL={open:'All open',unassigned:'Unassigned',overdue:'Overdue / SLA breach',closed:'Resolved & closed',all:'All tickets'};
function setCrumb(v){const el=$('#crumb');if(v&&v!=='tickets'){el.innerHTML='<span>'+VIEWNAME[v]+'</span>';return}
  const lbl=String(S.view).startsWith('agent:')?'My open':(VIEWLBL[S.view]||'Tickets');
  el.innerHTML='<b>'+esc(lbl)+'</b>'+(S.sel?'<i>&gt;</i><span>'+S.sel+'</span>':'')}
const PAL=[['#fdf1b8','#7a5d00'],['#d6e4ff','#25508f'],['#e0d8ff','#4b34a8'],['#ffe3cc','#9a4a0b'],['#d3f1de','#1e6b3a'],['#fbd9e5','#9c2a58']];

 m365:{label:'Microsoft 365 / Outlook',smtp_host:'smtp.office365.com',smtp_port:587,smtp_security:'starttls',imap_host:'outlook.office365.com',imap_port:993,note:'Your Microsoft 365 admin must allow IMAP and SMTP sign-in for this mailbox; an app password may be needed.'},
 own:{label:'My own domain / web hosting',smtp_host:'',smtp_port:465,smtp_security:'ssl',imap_host:'',imap_port:993,note:'Your hosting provider shows the server names, usually <code>mail.yourdomain.com</code>.'},
 custom:{label:'Something else',smtp_host:'',smtp_port:587,smtp_security:'starttls',imap_host:'',imap_port:993,note:''}};
async function setMail(el){
  const mbs=await api('/mailboxes');
  const chip=(ok,t)=>`<span style="display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:${ok?'#d3f1de':'var(--line)'};color:${ok?'#1e6b3a':'var(--mut)'}">${t}</span>`;
  el.innerHTML=`<div class="flex"><div class="sp"><b>Mailboxes</b><div style="color:var(--mut)">Connect your support email address so customer emails become tickets and replies are emailed back.</div></div><button class="btn" id="mbAdd">+ Add mailbox</button></div>
  ${mbs.map(m=>`<div class="card" style="margin-top:10px"><div class="flex"><b class="sp">${esc(m.name)} <span style="font-weight:400;color:var(--mut)">${esc(m.address)}</span> ${m.is_default?chip(1,'default'):''} ${m.active?'':chip(0,'switched off')}</b></div>
   <div style="margin:6px 0">${chip(m.can_send,m.can_send?'Sending set up':'Not sending')} ${chip(m.can_receive,m.can_receive?'Receiving set up':'Not receiving')}
   ${m.last_poll?`<span style="color:var(--mut);font-size:12px"> · last checked ${ago(m.last_poll)} ago · ${m.ingested} email(s) received</span>`:''}</div>
   ${m.last_error?`<div style="color:var(--red);font-size:13px">&#9888; ${esc(m.last_error)}</div>`:''}
   <div class="actions" style="margin-top:8px"><button class="btn sec" data-me="${m.id}">Edit</button><button class="btn sec" data-mt="${m.id}">Send a test email</button>${m.can_receive?`<button class="btn sec" data-mp="${m.id}">Check for mail now</button>`:''}
   ${m.is_default?'':`<button class="btn sec" data-md="${m.id}">Make default</button>`}<button class="btn sec" data-mx="${m.id}">Delete</button></div></div>`).join('')||`<div class="card" style="margin-top:10px;text-align:center;color:var(--mut)">No mailbox yet. Without one, replies are saved but not emailed, and customer emails don't arrive.<br><br><button class="btn" id="mbAdd2">+ Add your first mailbox</button></div>`}
  <p style="color:var(--mut)">Tickets that arrive by email are answered from the mailbox they came in on. Everything else uses the default mailbox. Passwords are kept on this PC only and never shown again.</p>`;
  const add=()=>mailboxModal();$('#mbAdd').onclick=add;if($('#mbAdd2'))$('#mbAdd2').onclick=add;
  el.onclick=async e=>{const b=e.target.closest('button[data-me],[data-mt],[data-mp],[data-md],[data-mx]');if(!b)return;const d=b.dataset,id=+(d.me||d.mt||d.mp||d.md||d.mx),m=mbs.find(x=>x.id===id);
    if(d.me)mailboxModal(m);
    if(d.mt)modal(`<h3 style="margin-top:0">Send a test email</h3><p>From <b>${esc(m.address)}</b> to:</p><input id="mt_to" type="email" placeholder="your own email address" value="${esc(S.meEmail||'')}"><div id="mt_r" style="margin:8px 0;min-height:1.4em"></div>
      <div class="flex"><span class="sp"></span><button class="btn sec" onclick="closeModal()">Close</button><button class="btn" id="mt_go">Send test</button></div>`)||($('#mt_go').onclick=async()=>{$('#mt_r').textContent='Sending…';
      try{const r=await api('/mailboxes/'+id+'/send-test','POST',{to:$('#mt_to').value});$('#mt_r').innerHTML=r.ok?'<span style="color:var(--grn,#16a34a)">&#10003; '+esc(r.message)+'</span>':'<span style="color:var(--red)">'+esc(r.message)+'</span>'}catch(e){$('#mt_r').textContent=''}});
    if(d.mp){toast('Checking…');const r=await api('/inbound/poll','POST',{});toast(r.error?'Problem: '+r.error:'Done - '+r.ingested+' new email(s)');loadSettings('mail')}
    if(d.md){await api('/mailboxes/'+id,'PATCH',{is_default:1});loadSettings('mail')}
    if(d.mx&&confirm('Delete mailbox "'+m.name+'"? Existing tickets are kept.')){await api('/mailboxes/'+id,'DELETE');loadSettings('mail')}};

function mailboxModal(m){
  const v=(k,dflt)=>esc(m?(m[k]??dflt??''):(dflt??''));
  modal(`<h3 style="margin-top:0">${m?'Edit':'Add'} mailbox</h3>
  ${m?'':`<label>What email service do you use?</label><select id="mb_pre">${Object.entries(MB_PRESETS).map(([k,p])=>`<option value="${k}">${p.label}</option>`).join('')}</select><div id="mb_note" style="color:var(--mut);font-size:13px;margin:4px 0 8px"></div>`}
  <div class="grid"><div><label>Name (for you)</label><input id="mb_name" value="${v('name','Support')}"></div><div><label>Email address</label><input id="mb_addr" type="email" value="${v('address')}" placeholder="support@yourcompany.com"></div></div>
  <label>Sender name customers see (optional)</label><input id="mb_from" value="${v('from_name')}" placeholder="e.g. Acme Support">

   <div class="grid"><div><label>Server</label><input id="mb_sh" value="${v('smtp_host')}" placeholder="smtp.example.com"></div><div><label>Port</label><input id="mb_sp" inputmode="numeric" value="${v('smtp_port',465)}"></div></div>
   <label>Security</label><select id="mb_ss">${opts([['ssl','SSL/TLS (usually port 465)'],['starttls','STARTTLS (usually port 587)'],['none','None (not recommended)']],m?.smtp_security||'ssl')}</select>
   <div class="grid"><div><label>User name <span style="color:var(--mut)">(blank = email address)</span></label><input id="mb_su" value="${v('smtp_user')}" autocomplete="off"></div><div><label>Password</label><input id="mb_spw" type="password" autocomplete="new-password" placeholder="${m?.has_smtp_password?'unchanged':''}"></div></div>
   <div class="flex" style="margin-top:8px"><button class="btn sec" type="button" id="mb_ts">Test sending</button><span id="mb_rs" style="font-size:13px"></span></div></fieldset>
  <fieldset style="border:1px solid var(--line);border-radius:8px;margin:12px 0;padding:8px 12px"><legend><b>Incoming mail (IMAP)</b> <span style="color:var(--mut);font-weight:400">- optional</span></legend>
   <div class="grid"><div><label>Server</label><input id="mb_ih" value="${v('imap_host')}" placeholder="imap.example.com"></div><div><label>Port</label><input id="mb_ip" inputmode="numeric" value="${v('imap_port',993)}"></div></div>
   <label><input type="checkbox" id="mb_issl" style="width:auto" ${(m?m.imap_ssl:1)?'checked':''}> Use SSL/TLS (recommended)</label>
   <div class="grid"><div><label>User name <span style="color:var(--mut)">(blank = email address)</span></label><input id="mb_iu" value="${v('imap_user')}" autocomplete="off"></div><div><label>Password</label><input id="mb_ipw" type="password" autocomplete="new-password" placeholder="${m?.has_imap_password?'unchanged':'blank = same as outgoing'}"></div></div>
   <div class="grid"><div><label>Folder to watch</label><input id="mb_if" value="${v('imap_folder','INBOX')}"></div><div><label>Check every (minutes)</label><input id="mb_pi" inputmode="numeric" value="${Math.round((m?.poll_seconds||60)/60)||1}"></div></div>
   <div class="flex" style="margin-top:8px"><button class="btn sec" type="button" id="mb_ti">Test receiving</button><span id="mb_ri" style="font-size:13px"></span></div></fieldset>
  <label><input type="checkbox" id="mb_act" style="width:auto" ${(m?m.active:1)?'checked':''}> This mailbox is switched on</label>
  <div class="flex" style="margin-top:14px"><span class="sp"></span><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" id="mb_ok">Save mailbox</button></div>`);
  const g=id=>$('#'+id).value.trim();
  const form=()=>{const d={name:g('mb_name'),address:g('mb_addr'),from_name:g('mb_from'),smtp_host:g('mb_sh'),smtp_port:g('mb_sp'),smtp_security:$('#mb_ss').value,smtp_user:g('mb_su'),
    imap_host:g('mb_ih'),imap_port:g('mb_ip'),imap_ssl:$('#mb_issl').checked?1:0,imap_user:g('mb_iu'),imap_folder:g('mb_if')||'INBOX',poll_seconds:Math.max(1,+g('mb_pi')||1)*60,active:$('#mb_act').checked?1:0};
    const sp=$('#mb_spw').value,ip=$('#mb_ipw').value;if(sp)d.smtp_password=sp;d.imap_password=ip||(m?'':sp);if(!d.imap_password)delete d.imap_password;return d};
  const preset=k=>{const p=MB_PRESETS[k];$('#mb_sh').value=p.smtp_host;$('#mb_sp').value=p.smtp_port;$('#mb_ss').value=p.smtp_security;$('#mb_ih').value=p.imap_host;$('#mb_ip').value=p.imap_port;$('#mb_note').innerHTML=p.note};
  if(!m){$('#mb_pre').onchange=e=>preset(e.target.value);preset('gmail')}
  const test=(which,out)=>async()=>{const d=form();d.which=which;if(m)d.id=m.id;$(out).style.color='';$(out).textContent='Testing…';
    try{const r=await api('/mailboxes/test','POST',d);$(out).style.color=r.ok?'#16a34a':'var(--red)';$(out).textContent=(r.ok?'✓ ':'')+r.message}catch(e){$(out).textContent=''}};
  $('#mb_ts').onclick=test('smtp','#mb_rs');$('#mb_ti').onclick=test('imap','#mb_ri');

    try{m?await api('/mailboxes/'+m.id,'PATCH',d):await api('/mailboxes','POST',d);closeModal();toast('Mailbox saved');loadSettings('mail')}catch(e){}};

  <div class="card"><b>Recent emails sent</b><table style="margin-top:8px"><tr><th>When</th><th>Ticket</th><th>For</th><th>To</th><th>Result</th></tr>${log.map(l=>`<tr><td>${ago(l.created_at)} ago</td><td>${l.ticket_id?'<a href="#" data-tk="'+l.ticket_id+'">#'+l.ticket_id+'</a>':''}</td><td>${esc(l.event)}</td><td>${esc(l.to_addr)}</td>
   <td style="color:${l.status==='sent'?'#16a34a':'var(--red)'}">${esc(l.status)}</td></tr>`).join('')||'<tr><td colspan="5" style="color:var(--mut)">Nothing sent yet.</td></tr>'}</table></div>`;

function ticketText(t,thread,noLink){
  let s=`Ticket #${t.id}: ${t.subject}\n${noLink?'':'Link: '+ticketLink(t.id)+'\n'}Status: ${ST[t.status]} | Priority: ${PR[t.priority]} | Agent: ${t.responder_name||'Unassigned'}\nRequester: ${t.requester_name} <${t.requester_email}>${t.requester_phone?' '+t.requester_phone:''}\nCreated: ${fdate(t.created_at)}`;

  if(body.length>1500)body=body.slice(0,1500)+'…';
