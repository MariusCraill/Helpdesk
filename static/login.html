<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Helpdesk sign in</title>
<meta name="theme-color" content="#2563eb"><script>const BASE=(location.pathname.match(/^\/helpdesk(?=\/|$)/i)||[''])[0];document.write('<link rel="icon" href="'+BASE+'/icon.svg">')</script>
<style>:root{--bg:#f4f6f9;--p:#fff;--ink:#1d2733;--mut:#6b7785;--line:#e3e8ee;--acc:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--p:#18202a;--ink:#e6ebf1;--mut:#8a97a6;--line:#27323f;--acc:#3b82f6}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:16px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
.c{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:24px;width:min(340px,92vw)}
h1{margin:0 0 4px;font-size:22px}h1 b{color:var(--acc)}p{color:var(--mut);margin:0 0 14px}
input{width:100%;box-sizing:border-box;padding:12px;font:inherit;font-size:20px;letter-spacing:.3em;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--p);color:var(--ink)}
button{width:100%;margin-top:12px;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:12px;font:inherit;cursor:pointer}
#err{color:#dc2626;min-height:1.4em;margin-top:8px;font-size:14px}</style></head>
<body><form class="c" id="f"><h1>Help<b>desk</b></h1><p>Enter your agent PIN to sign in.</p>
<input id="pin" inputmode="numeric" autocomplete="current-password" autofocus placeholder="••••••"><div id="err"></div><button>Sign in</button></form>
<script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const r=await fetch(BASE+'/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-Base-Path':BASE},body:JSON.stringify({pin:document.getElementById('pin').value})});
 if(r.ok){(/\/login\/?$/.test(location.pathname)?location.href=BASE+'/'+(location.hash||''):location.reload())}else{const j=await r.json().catch(()=>({}));document.getElementById('err').textContent=j.error||'Error';document.getElementById('pin').select()}};
</script></body></html>
