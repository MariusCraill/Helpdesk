name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace -Pvc=${{ github.run_number }} assembleRelease 2>&1 | tee ../build.log

      - name: Show why the build failed
        if: failure()
        run: |
          echo "::error title=Gradle build log::$(grep -v '^$' build.log 2>/dev/null | tail -45 | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk Helpdesk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Helpdesk-apk
          path: Helpdesk.apk

      - name: Publish as a release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Helpdesk app (build ${{ github.run_number }})
          body: Download Helpdesk.apk on your phone and open it to install or update.
          files: Helpdesk.apk
