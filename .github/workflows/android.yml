name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon -Pvc=${{ github.run_number }} assembleRelease

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk Helpdesk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Helpdesk-apk
          path: Helpdesk.apk

      - name: Publish as a release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Helpdesk app (build ${{ github.run_number }})
          body: Download Helpdesk.apk on your phone and open it to install or update.
          files: Helpdesk.apk
